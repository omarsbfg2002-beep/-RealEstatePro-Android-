<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق العقارات برو</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        header {
            background-color: #1b4d3e;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #1b4d3e;
        }
        .price {
            color: #e67e22;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h2>عقارات الإمارات - إدارة وبيع</h2>
    </header>

    <div class="card">
        <h3>فلل الفاخرة للبيع</h3>
        <p>موقع مميز، إطلالة راقية، وتصميم عصري.</p>
        <p class="price">السعر: 3,500,000 درهم</p>
    </div>

    <div class="card">
        <h3>أرض تجارية / مساطحة</h3>
        <p>مناسبة للمشاريع الكبرى والتطوير الاستثماري.</p>
        <p class="price">السعر: حسب التفاوض</p>
    </div>

</body>
</html>
